<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the website responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Clock</title>
    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="clock-container">
        <h1>Digital Clock</h1>
       
        <div id="clock">12:00:00 AM</div>
         <p id="date">Monday, 10 August 2026</p>
        <div class="buttons">

            <!-- Change between 12 and 24 hour format -->
            <button id="formatButton">
                24-Hour Format
            </button>

            <!-- Change between light and dark mode -->
            <button id="themeButton">
                Dark Mode
            </button>

        </div>

    </main>

    <!-- Link JavaScript -->
    <script src="script.js"></script>

</body>

</html>
